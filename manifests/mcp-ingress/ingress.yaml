apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-ingress
  namespace: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # SSE/Streamable HTTPのコネクションが切れないよう長めに設定
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"  # SSEはバッファリング無効化
spec:
  ingressClassName: nginx
  rules:
  - http:  # hostなし = ngrokのどのホスト名でもマッチ
      paths:
      - path: /mcp/prometheus(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: prometheus-mcp
            port:
              number: 9000
      - path: /mcp/grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-mcp
            port:
              number: 8081
      - path: /mcp/elastic(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: elasticsearch-mcp
            port:
              number: 8080