# monitoring namespaceのMCPサーバーへのブリッジ
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp
  namespace: mcp
spec:
  type: ExternalName
  externalName: prometheus-mcp.monitoring.svc.cluster.local
  ports:
  - port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: mcp
spec:
  type: ExternalName
  externalName: grafana-mcp.monitoring.svc.cluster.local
  ports:
  - port: 8081
---
# elastic-system namespaceのMCPサーバーへのブリッジ
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-mcp
  namespace: mcp
spec:
  type: ExternalName
  externalName: elasticsearch-mcp.elastic-system.svc.cluster.local
  ports:
  - port: 8080
