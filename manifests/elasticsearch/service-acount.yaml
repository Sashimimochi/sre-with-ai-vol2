# Filebeat 用設定
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elastic-system
---
# --- ここから MCP 自動化用の新規追記 ---
# APIキー発行 Job 用の ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-setup-sa
  namespace: elastic-system
---
# Secret を操作するための権限定義
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-setup-role
  namespace: elastic-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  # APIキーを読み取り、作成、更新するために必要
  verbs: ["get", "create", "patch", "list", "watch"]
---
# ServiceAccount と Role の紐付け
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-setup-binding
  namespace: elastic-system
subjects:
- kind: ServiceAccount
  name: mcp-setup-sa
  namespace: elastic-system
roleRef:
  kind: Role
  name: mcp-setup-role
  apiGroup: rbac.authorization.k8s.io