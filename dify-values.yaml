# ローカル(kind)環境用の最小限の設定
# サービスタイプをNodePortに変更してkind外からアクセス可能にする
service:
  type: NodePort

# 本番環境ではIngressを使うが、kind環境では無効化
ingress:
  enabled: false

# 必要に応じてリソース制限を調整
api:
  resources:
    requests:
      cpu: '500m'
      memory: '512Mi'
    limits:
      cpu: '1000m'
      memory: '1Gi'

worker:
  resources:
    requests:
      cpu: '500m'
      memory: '512Mi'
    limits:
      cpu: '1000m'
      memory: '1Gi'
